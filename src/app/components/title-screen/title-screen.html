    @if (currentScreen() === 'title') {
    <div class="title-screen">
        <div class="title-content">
            <h1>Quest Engine</h1>
            <button (click)="startGame()">Begin Adventure</button>
        </div>
    </div>
    }

    @if (currentScreen() === 'character-creation') {
    <div class="character-creation">
        <div class="character-creation-content">
            <h2>Create Your Character</h2>
            <p>What is your name?</p>
            <input type="text" [(ngModel)]="playerName" placeholder="Enter your name..." ali/>
            <button (click)="createCharacter()">Submit</button>
        </div>

    </div>
    }

    @if (currentScreen() === 'game') {
        <app-game />
    }
